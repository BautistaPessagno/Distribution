# Fly.io app definition. Deploy with ./scripts/deploy.sh (one command from a
# clean checkout). TLS terminates at the Fly edge under the app's domain.
app = "marketingos"
primary_region = "eze"

[build]

[env]
  LITESTREAM_ENABLED = "1"
  DATABASE_PATH = "/data/marketingos.db"
  PORT = "8080"

[mounts]
  source = "marketingos_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
